<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velocity Motors</title>
<link rel="icon" href="images/icons/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="#top"><img src="images/icons/logo.svg" alt="" width="32" height="32"> Velocity Motors</a>
  <nav><a href="#cars">Cars</a><a href="#gallery">Gallery</a><a href="#contact">Contact</a></nav>
</header>

<section class="hero" id="top">
  <div class="slides">
    <img src="images/hero/hero-1.svg" alt="Hero 1" class="slide active">
    <img src="images/hero/hero-2.svg" alt="Hero 2" class="slide">
    <img src="images/hero/hero-3.svg" alt="Hero 3" class="slide">
  </div>
  <div class="hero-text"><h1>Drive your next chapter</h1><p>Browse our latest sedans, SUVs, hatchbacks and coupes.</p>
  <a class="btn" href="#cars">View cars</a></div>
</section>

<section id="cars" class="section">
  <h2>Our Cars</h2>
  <div class="filters" id="carFilters"></div>
  <div class="grid" id="carGrid"></div>
</section>

<section id="gallery" class="section alt">
  <h2>Gallery <small id="galCount"></small></h2>
  <div class="filters" id="galFilters"></div>
  <div class="masonry" id="galGrid"></div>
</section>

<section id="contact" class="section">
  <h2>Contact</h2>
  <p>Replace this with your real address, phone and email.</p>
</section>

<footer>&copy; <span id="yr"></span> Velocity Motors. Demo images are generated placeholders.</footer>

<div class="lightbox" id="lb"><button id="lbClose" aria-label="Close">&times;</button><button id="lbPrev">&#8249;</button>
<figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure><button id="lbNext">&#8250;</button></div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
